<!DOCTYPE html>
<html lang="en" class="dark" data-palette="lagoon">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nikhil Ranga — Full Stack Developer & AI/ML Engineer</title>
  <meta name="description" content="Nikhil Ranga — Full Stack Developer and AI/ML Engineer building playful, performant web and mobile experiences with React, React Native, Node.js and Python." />
  <meta name="author" content="nikhilranga" />
  <meta name="theme-color" content="#031618" />

  <link rel="icon" href="/favicon.ico" type="image/gif" />

  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong colours
    (function () {
      try {
        var mode = localStorage.getItem("vite-ui-theme") || "dark";
        if (mode === "system") mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var palette = localStorage.getItem("vite-ui-palette");
        var root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add(mode);
        if (/^(glacier|lagoon|ink)$/.test(palette)) root.dataset.palette = palette;
      } catch (e) {}
    })();
  </script>
  <style>
    /* Boot shell: visible on the very first paint, before any JavaScript arrives. Pure CSS, so it
       keeps animating smoothly however slow the network is. Removed once the intro is ready. */
    #boot { --bg: 168 56% 96.5%; --fg: 182 75% 9.4%; --mu: 174 20% 36.5%; --b1: 176 89% 34.9%; --b2: 11 86% 58.4%;
      position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 22px; background: hsl(var(--bg)); color: hsl(var(--fg));
      font: 500 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; transition: opacity .6s ease, visibility .6s; }
    .dark #boot { --bg: 186 78% 5.3%; --fg: 166 68% 96.3%; --mu: 172 25% 64.9%; --b1: 176 80% 49.4%; --b2: 11 100% 68%; }
    [data-palette="glacier"] #boot { --bg: 213 73% 97.1%; --fg: 215 70% 9.2%; --mu: 214 25% 40.2%; --b1: 212 76% 50%; --b2: 233 70% 59.4%; }
    .dark[data-palette="glacier"] #boot { --bg: 219 70% 6.5%; --fg: 209 100% 95.9%; --mu: 214 31% 67.6%; --b1: 209 100% 64.5%; --b2: 232 100% 74.5%; }
    [data-palette="ink"] #boot { --bg: 45 31% 94.9%; --fg: 235 22% 10%; --mu: 237 9% 39.6%; --b1: 235 100% 58.4%; --b2: 11 100% 60.6%; }
    .dark[data-palette="ink"] #boot { --bg: 233 22% 8%; --fg: 45 31% 94.9%; --mu: 237 11% 68.6%; --b1: 235 100% 71.8%; --b2: 11 100% 68%; }
    #boot.boot-hide { opacity: 0; visibility: hidden; }
    #boot .boot-mark { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
      font: 800 22px/1 system-ui, sans-serif; color: hsl(var(--bg));
      background: linear-gradient(135deg, hsl(var(--b1)), hsl(var(--b2)));
      box-shadow: 0 18px 50px -12px hsl(var(--b1) / .7); animation: boot-float 2.4s ease-in-out infinite; }
    #boot .boot-net { display: flex; align-items: center; gap: 10px; }
    #boot .boot-node { width: 14px; height: 14px; border-radius: 4px; border: 2px solid hsl(var(--b1)); }
    #boot .boot-node.end { border-color: hsl(var(--b2)); }
    #boot .boot-pipe { position: relative; width: 120px; height: 3px; border-radius: 3px; background: hsl(var(--fg) / .12); overflow: hidden; }
    #boot .boot-pipe i { position: absolute; top: 0; left: -20%; width: 20%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, transparent, hsl(var(--b1)), hsl(var(--b2))); animation: boot-flow 1.2s linear infinite; }
    #boot .boot-pipe i:nth-child(2) { animation-delay: -.4s; }
    #boot .boot-pipe i:nth-child(3) { animation-delay: -.8s; }
    #boot .boot-text { color: hsl(var(--mu)); letter-spacing: .04em; }
    #boot .boot-text b { color: hsl(var(--b1)); font-weight: 600; }
    @keyframes boot-flow { to { left: 100%; } }
    @keyframes boot-float { 50% { transform: translateY(-6px) rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; } }
  </style>
</head>

<body>
  <div id="boot" aria-hidden="true">
    <div class="boot-mark">NR</div>
    <div class="boot-net">
      <span class="boot-node"></span>
      <span class="boot-pipe"><i></i><i></i><i></i></span>
      <span class="boot-node end"></span>
    </div>
    <div class="boot-text"><b>&gt;</b> connecting to server&hellip;</div>
  </div>
  <div id="root"></div>

  <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
